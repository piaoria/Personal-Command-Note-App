appId: personal.commandnote.desktop
productName: CommandNote
directories:
  output: release/${version}
files:
  - out/**
  - package.json
asar: true
win:
  icon: resources/commandnote.ico
  target:
    - target: nsis
      arch: [x64]
  executableName: CommandNote
nsis:
  installerIcon: resources/commandnote.ico
  uninstallerIcon: resources/commandnote.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  artifactName: CommandNote-${version}-setup.${ext}
